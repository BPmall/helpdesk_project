<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ — Corporate Helpdesk</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>* { font-family: 'Prompt', sans-serif; }</style>
</head>
<body class="min-h-screen bg-gradient-to-br from-red-900 via-red-800 to-gray-900 flex items-center justify-center p-4">

    <div class="w-full max-w-md">
        <!-- Logo card -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-white/10 backdrop-blur-sm mb-4">
                <i class="fas fa-headset text-3xl text-white"></i>
            </div>
            <h1 class="text-2xl font-bold text-white">IT Helpdesk & Maintenance</h1>
            <p class="text-red-200 text-sm mt-1">ระบบแจ้งซ่อมบำรุง</p>
        </div>

        <!-- Login Form -->
        <div class="bg-white/95 backdrop-blur-md rounded-2xl shadow-2xl p-8">
            <h2 class="text-xl font-bold text-gray-800 mb-6">เข้าสู่ระบบ</h2>

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            {% for category, message in messages %}
            <div class="mb-4 p-3 rounded-lg text-sm
                {{ 'bg-green-50 text-green-700 border border-green-200' if category == 'success' else '' }}
                {{ 'bg-red-50 text-red-700 border border-red-200' if category == 'danger' else '' }}
                {{ 'bg-yellow-50 text-yellow-700 border border-yellow-200' if category == 'warning' else '' }}
                {{ 'bg-blue-50 text-blue-700 border border-blue-200' if category == 'info' else '' }}
            ">
                <i class="fas {{ 'fa-check-circle' if category == 'success' else 'fa-exclamation-circle' }}"></i>
                {{ message }}
            </div>
            {% endfor %}
            {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('auth.login') }}" class="space-y-5">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">ชื่อผู้ใช้</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                            <i class="fas fa-user"></i>
                        </span>
                        <input type="text" name="username" required autocomplete="username"
                               class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-red-500 focus:border-red-500 outline-none transition-all text-sm"
                               placeholder="กรอกชื่อผู้ใช้">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">รหัสผ่าน</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                            <i class="fas fa-lock"></i>
                        </span>
                        <input type="password" name="password" required autocomplete="current-password" id="login-password"
                               class="w-full pl-10 pr-10 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-red-500 focus:border-red-500 outline-none transition-all text-sm"
                               placeholder="กรอกรหัสผ่าน">
                        <button type="button" onclick="togglePassword('login-password', this)" class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-400 hover:text-gray-600">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit"
                        class="w-full py-2.5 rounded-lg bg-gradient-to-r from-red-700 to-red-600 hover:from-red-800 hover:to-red-700 text-white font-semibold text-sm shadow-lg shadow-red-500/20 transition-all hover:shadow-red-500/40">
                    <i class="fas fa-sign-in-alt mr-2"></i>เข้าสู่ระบบ
                </button>
            </form>

            <div class="mt-6 text-center">
                <p class="text-sm text-gray-500">
                    ยังไม่มีบัญชี?
                    <a href="{{ url_for('auth.register') }}" class="text-red-600 hover:text-red-700 font-semibold">สมัครสมาชิก</a>
                </p>
            </div>

            <!-- Demo accounts -->
            <div class="mt-6 pt-4 border-t border-gray-100">
                <p class="text-xs text-gray-400 text-center mb-3">บัญชีทดสอบ (รหัสผ่าน: 1234)</p>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="fillLogin('admin')" class="py-1.5 text-xs rounded-lg border border-gray-200 hover:bg-gray-50 transition-colors text-gray-600">
                        <i class="fas fa-shield-alt text-red-500"></i> Admin
                    </button>
                    <button onclick="fillLogin('somchai')" class="py-1.5 text-xs rounded-lg border border-gray-200 hover:bg-gray-50 transition-colors text-gray-600">
                        <i class="fas fa-user text-blue-500"></i> พนักงาน
                    </button>
                    <button onclick="fillLogin('manager1')" class="py-1.5 text-xs rounded-lg border border-gray-200 hover:bg-gray-50 transition-colors text-gray-600">
                        <i class="fas fa-user-tie text-green-500"></i> Manager
                    </button>
                    <button onclick="fillLogin('head1')" class="py-1.5 text-xs rounded-lg border border-gray-200 hover:bg-gray-50 transition-colors text-gray-600">
                        <i class="fas fa-user-shield text-purple-500"></i> หัวหน้า IT
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function fillLogin(username) {
            document.querySelector('input[name="username"]').value = username;
            document.querySelector('input[name="password"]').value = '1234';
        }
        function togglePassword(id, btn) {
            const input = document.getElementById(id);
            const icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }
    </script>
</body>
</html>

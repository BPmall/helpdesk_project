<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สมัครสมาชิก — Corporate Helpdesk</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>* { font-family: 'Prompt', sans-serif; }</style>
</head>
<body class="min-h-screen bg-gradient-to-br from-red-900 via-red-800 to-gray-900 flex items-center justify-center p-4">

    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-white/10 backdrop-blur-sm mb-4">
                <i class="fas fa-user-plus text-3xl text-white"></i>
            </div>
            <h1 class="text-2xl font-bold text-white">สมัครสมาชิก</h1>
            <p class="text-red-200 text-sm mt-1">สร้างบัญชีเพื่อใช้งานระบบแจ้งซ่อม</p>
        </div>

        <div class="bg-white/95 backdrop-blur-md rounded-2xl shadow-2xl p-8">
            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            {% for category, message in messages %}
            <div class="mb-4 p-3 rounded-lg text-sm
                {{ 'bg-red-50 text-red-700 border border-red-200' if category == 'danger' else 'bg-green-50 text-green-700 border border-green-200' }}
            ">{{ message }}</div>
            {% endfor %}
            {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('auth.register') }}" class="space-y-4">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">ชื่อผู้ใช้ <span class="text-red-500">*</span></label>
                        <input type="text" name="username" required
                               class="w-full px-3 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-red-500 focus:border-red-500 outline-none text-sm"
                               placeholder="username">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">ชื่อ-สกุล <span class="text-red-500">*</span></label>
                        <input type="text" name="name" required
                               class="w-full px-3 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-red-500 focus:border-red-500 outline-none text-sm"
                               placeholder="สมชาย ใจดี">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">อีเมล <span class="text-red-500">*</span></label>
                    <input type="email" name="email" required
                           class="w-full px-3 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-red-500 focus:border-red-500 outline-none text-sm"
                           placeholder="email@company.com">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">แผนก</label>
                    <select name="department" class="w-full px-3 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-red-500 focus:border-red-500 outline-none text-sm">
                        <option value="">— เลือกแผนก —</option>
                        <option value="IT">IT</option>
                        <option value="บัญชี">บัญชี</option>
                        <option value="การตลาด">การตลาด</option>
                        <option value="บุคคล">บุคคล</option>
                        <option value="จัดซื้อ">จัดซื้อ</option>
                        <option value="ผลิต">ผลิต</option>
                        <option value="อื่นๆ">อื่นๆ</option>
                    </select>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">รหัสผ่าน <span class="text-red-500">*</span></label>
                        <input type="password" name="password" required
                               class="w-full px-3 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-red-500 focus:border-red-500 outline-none text-sm"
                               placeholder="••••••••">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">ยืนยันรหัสผ่าน <span class="text-red-500">*</span></label>
                        <input type="password" name="confirm_password" required
                               class="w-full px-3 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-red-500 focus:border-red-500 outline-none text-sm"
                               placeholder="••••••••">
                    </div>
                </div>

                <button type="submit"
                        class="w-full py-2.5 rounded-lg bg-gradient-to-r from-red-700 to-red-600 hover:from-red-800 hover:to-red-700 text-white font-semibold text-sm shadow-lg shadow-red-500/20 transition-all mt-2">
                    <i class="fas fa-user-plus mr-2"></i>สมัครสมาชิก
                </button>
            </form>

            <div class="mt-6 text-center">
                <p class="text-sm text-gray-500">
                    มีบัญชีแล้ว?
                    <a href="{{ url_for('auth.login') }}" class="text-red-600 hover:text-red-700 font-semibold">เข้าสู่ระบบ</a>
                </p>
            </div>
        </div>
    </div>
</body>
</html>

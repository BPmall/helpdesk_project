{% extends "base.html" %}

{% block title %}ปฏิทินงาน — Helpdesk{% endblock %}
{% block page_title %}<i class="fas fa-calendar-alt text-brand-600 mr-2"></i>ปฏิทินงานแจ้งซ่อม{% endblock %}

{% block content %}
<div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 overflow-hidden">
    <div class="p-4 border-b border-gray-100 dark:border-gray-700 flex justify-between items-center">
        <div class="flex items-center gap-4">
            <button id="prev-month" class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors"><i class="fas fa-chevron-left"></i></button>
            <h2 id="calendar-title" class="text-lg font-bold text-gray-800 dark:text-white min-w-[180px] text-center"></h2>
            <button id="next-month" class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors"><i class="fas fa-chevron-right"></i></button>
        </div>
        <button id="today-btn" class="px-4 py-2 text-sm border border-gray-200 dark:border-gray-600 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors">วันนี้</button>
    </div>

    <!-- Calendar Grid -->
    <div class="p-4">
        <div class="grid grid-cols-7 text-center text-xs font-semibold text-gray-500 dark:text-gray-400 mb-2">
            <div class="py-2 text-red-500">อา</div>
            <div class="py-2">จ</div>
            <div class="py-2">อ</div>
            <div class="py-2">พ</div>
            <div class="py-2">พฤ</div>
            <div class="py-2">ศ</div>
            <div class="py-2 text-blue-500">ส</div>
        </div>
        <div id="calendar-grid" class="grid grid-cols-7 gap-px bg-gray-200 dark:bg-gray-700 rounded-lg overflow-hidden">
            <!-- JS fills this -->
        </div>
    </div>

    <!-- Legend -->
    <div class="p-4 border-t border-gray-100 dark:border-gray-700 flex flex-wrap gap-4 text-xs text-gray-500 dark:text-gray-400">
        <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-[#3B82F6] inline-block"></span> รอดำเนินการ</span>
        <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-[#8B5CF6] inline-block"></span> อนุมัติแล้ว</span>
        <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-[#F59E0B] inline-block"></span> กำลังแก้ไข</span>
        <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-[#10B981] inline-block"></span> เสร็จสิ้น</span>
        <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-[#EF4444] inline-block"></span> ปฏิเสธ</span>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    let currentDate = new Date();
    let events = [];

    const thaiMonths = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน',
                        'กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];

    async function loadEvents() {
        const res = await fetch('/api/v1/calendar/events');
        events = await res.json();
        renderCalendar();
    }

    function renderCalendar() {
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();
        const beYear = year + 543;

        document.getElementById('calendar-title').textContent = `${thaiMonths[month]} ${beYear}`;

        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const today = new Date();

        let html = '';

        // Empty cells before first day
        for (let i = 0; i < firstDay; i++) {
            html += '<div class="bg-gray-50 dark:bg-gray-800/50 min-h-[80px] p-1"></div>';
        }

        // Day cells
        for (let day = 1; day <= daysInMonth; day++) {
            const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
            const isToday = (today.getFullYear() === year && today.getMonth() === month && today.getDate() === day);
            const dayEvents = events.filter(e => e.start === dateStr);

            html += `<div class="bg-white dark:bg-gray-800 min-h-[80px] p-1.5 ${isToday ? 'ring-2 ring-brand-500 ring-inset' : ''} hover:bg-gray-50 dark:hover:bg-gray-700/50 transition-colors">`;
            html += `<p class="text-xs font-medium mb-1 ${isToday ? 'text-brand-600 dark:text-brand-400 font-bold' : 'text-gray-600 dark:text-gray-400'}">${day}</p>`;

            dayEvents.slice(0, 3).forEach(ev => {
                html += `<a href="${ev.url}" class="block text-[10px] px-1.5 py-0.5 mb-0.5 rounded truncate text-white font-medium hover:opacity-80 transition-opacity" style="background: ${ev.color}">${ev.title.split(' — ')[0]}</a>`;
            });

            if (dayEvents.length > 3) {
                html += `<p class="text-[10px] text-gray-400 text-center">+${dayEvents.length - 3} more</p>`;
            }

            html += '</div>';
        }

        document.getElementById('calendar-grid').innerHTML = html;
    }

    document.getElementById('prev-month').addEventListener('click', () => {
        currentDate.setMonth(currentDate.getMonth() - 1);
        renderCalendar();
    });

    document.getElementById('next-month').addEventListener('click', () => {
        currentDate.setMonth(currentDate.getMonth() + 1);
        renderCalendar();
    });

    document.getElementById('today-btn').addEventListener('click', () => {
        currentDate = new Date();
        renderCalendar();
    });

    loadEvents();
</script>
{% endblock %}

version: '3.8'

services:
  web:
    build: .
    container_name: helpdesk-web
    ports:
      - "5000:5000"
    environment:
      - SECRET_KEY=change-me-in-production-please
      - DATABASE_URL=sqlite:///instance/helpdesk.db
    volumes:
      - ./instance:/app/instance
    restart: unless-stopped

